<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集中力トレーニングアプリ - ADHD子ども向け</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Hiragino Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 3em;
            color: #667eea;
            font-weight: bold;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .timer-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .timer-mode {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .timer-time {
            font-size: 5em;
            color: #333;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
        }

        .timer-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .btn-pause {
            background: #ff9800;
            color: white;
        }

        .btn-pause:hover {
            background: #e68900;
            transform: scale(1.05);
        }

        .btn-reset {
            background: #f44336;
            color: white;
        }

        .btn-reset:hover {
            background: #da190b;
            transform: scale(1.05);
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .setting-group {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 10px;
            color: #667eea;
            font-weight: bold;
        }

        .setting-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
        }

        .achievements {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .star {
            font-size: 3em;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .star.earned {
            opacity: 1;
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .message {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            border-radius: 15px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .timer-time {
                font-size: 3.5em;
            }

            button {
                padding: 12px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 集中力トレーニングアプリ 🌟</h1>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="totalSessions">0</div>
                <div class="stat-label">完了セッション</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPoints">0</div>
                <div class="stat-label">ポイント</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="currentStreak">0</div>
                <div class="stat-label">連続日数</div>
            </div>
        </div>

        <div class="main-card">
            <div class="timer-display">
                <div class="timer-mode" id="timerMode">集中タイム</div>
                <div class="timer-time" id="timerDisplay">05:00</div>
            </div>

            <div class="timer-controls">
                <button class="btn-start" id="startBtn">スタート</button>
                <button class="btn-pause" id="pauseBtn">一時停止</button>
                <button class="btn-reset" id="resetBtn">リセット</button>
            </div>

            <div class="settings">
                <div class="setting-group">
                    <label for="focusTime">集中時間（分）</label>
                    <input type="number" id="focusTime" value="5" min="1" max="60">
                </div>
                <div class="setting-group">
                    <label for="breakTime">休憩時間（分）</label>
                    <input type="number" id="breakTime" value="2" min="1" max="30">
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>

            <div class="achievements">
                <span class="star" id="star1">⭐</span>
                <span class="star" id="star2">⭐</span>
                <span class="star" id="star3">⭐</span>
                <span class="star" id="star4">⭐</span>
                <span class="star" id="star5">⭐</span>
            </div>
        </div>

        <div class="message" id="messageBox"></div>
    </div>

    <script>
        // アプリケーションの状態管理
        const app = {
            isRunning: false,
            isPaused: false,
            isFocusMode: true,
            timeLeft: 0,
            totalTime: 0,
            timer: null,
            stats: {
                totalSessions: 0,
                totalPoints: 0,
                currentStreak: 0,
                starsEarned: 0
            }
        };

        // DOM要素
        const timerDisplay = document.getElementById('timerDisplay');
        const timerMode = document.getElementById('timerMode');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const focusTimeInput = document.getElementById('focusTime');
        const breakTimeInput = document.getElementById('breakTime');
        const messageBox = document.getElementById('messageBox');
        const progressFill = document.getElementById('progressFill');

        // ローカルストレージからデータを読み込む
        function loadStats() {
            const saved = localStorage.getItem('adhdAppStats');
            if (saved) {
                app.stats = JSON.parse(saved);
                updateStatsDisplay();
            }
        }

        // ローカルストレージにデータを保存
        function saveStats() {
            localStorage.setItem('adhdAppStats', JSON.stringify(app.stats));
        }

        // 統計表示を更新
        function updateStatsDisplay() {
            document.getElementById('totalSessions').textContent = app.stats.totalSessions;
            document.getElementById('totalPoints').textContent = app.stats.totalPoints;
            document.getElementById('currentStreak').textContent = app.stats.currentStreak;

            // スターの表示を更新
            for (let i = 1; i <= 5; i++) {
                const star = document.getElementById(`star${i}`);
                if (i <= app.stats.starsEarned) {
                    star.classList.add('earned');
                } else {
                    star.classList.remove('earned');
                }
            }
        }

        // タイマーを初期化
        function initTimer() {
            const minutes = app.isFocusMode ?
                parseInt(focusTimeInput.value) :
                parseInt(breakTimeInput.value);
            app.timeLeft = minutes * 60;
            app.totalTime = app.timeLeft;
            updateDisplay();
            updateProgress();
        }

        // 時間表示を更新
        function updateDisplay() {
            const minutes = Math.floor(app.timeLeft / 60);
            const seconds = app.timeLeft % 60;
            timerDisplay.textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            timerMode.textContent = app.isFocusMode ? '🎯 集中タイム' : '☕ 休憩タイム';
        }

        // 進捗バーを更新
        function updateProgress() {
            const progress = ((app.totalTime - app.timeLeft) / app.totalTime) * 100;
            progressFill.style.width = `${progress}%`;
            progressFill.textContent = `${Math.round(progress)}%`;
        }

        // メッセージを表示
        function showMessage(text) {
            messageBox.textContent = text;
            messageBox.style.display = 'block';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 3000);
        }

        // タイマー完了時の処理
        function onTimerComplete() {
            playSound();

            if (app.isFocusMode) {
                // 集中タイム完了
                app.stats.totalSessions++;
                app.stats.totalPoints += 10;

                // スターを獲得
                if (app.stats.totalSessions % 3 === 0 && app.stats.starsEarned < 5) {
                    app.stats.starsEarned++;
                    showMessage('🎉 スターを獲得！すごいぞ！');
                } else {
                    showMessage('✨ よく頑張ったね！10ポイント獲得！');
                }

                saveStats();
                updateStatsDisplay();

                // 休憩モードに切り替え
                app.isFocusMode = false;
            } else {
                // 休憩タイム完了
                showMessage('💪 休憩完了！次も頑張ろう！');
                app.isFocusMode = true;
            }

            initTimer();
            app.isRunning = false;
            startBtn.textContent = 'スタート';
        }

        // 音を鳴らす（ブラウザのビープ音）
        function playSound() {
            const audio = new AudioContext();
            const oscillator = audio.createOscillator();
            const gainNode = audio.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audio.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audio.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.5);

            oscillator.start(audio.currentTime);
            oscillator.stop(audio.currentTime + 0.5);
        }

        // タイマーを1秒進める
        function tick() {
            if (app.timeLeft > 0) {
                app.timeLeft--;
                updateDisplay();
                updateProgress();
            } else {
                clearInterval(app.timer);
                onTimerComplete();
            }
        }

        // スタートボタンのイベントハンドラ
        startBtn.addEventListener('click', () => {
            if (!app.isRunning) {
                app.isRunning = true;
                app.isPaused = false;

                if (app.timeLeft === 0) {
                    initTimer();
                }

                app.timer = setInterval(tick, 1000);
                startBtn.textContent = '実行中...';
                showMessage('🚀 スタート！集中しよう！');
            }
        });

        // 一時停止ボタンのイベントハンドラ
        pauseBtn.addEventListener('click', () => {
            if (app.isRunning) {
                clearInterval(app.timer);
                app.isRunning = false;
                app.isPaused = true;
                startBtn.textContent = '再開';
                showMessage('⏸️ 一時停止中');
            }
        });

        // リセットボタンのイベントハンドラ
        resetBtn.addEventListener('click', () => {
            clearInterval(app.timer);
            app.isRunning = false;
            app.isPaused = false;
            app.isFocusMode = true;
            initTimer();
            startBtn.textContent = 'スタート';
            showMessage('🔄 リセットしました');
        });

        // 設定変更時のイベントハンドラ
        focusTimeInput.addEventListener('change', () => {
            if (!app.isRunning && app.isFocusMode) {
                initTimer();
            }
        });

        breakTimeInput.addEventListener('change', () => {
            if (!app.isRunning && !app.isFocusMode) {
                initTimer();
            }
        });

        // 初期化
        loadStats();
        initTimer();
    </script>
</body>
</html>
